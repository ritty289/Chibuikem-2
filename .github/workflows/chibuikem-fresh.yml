here
name: Chibuikem Fresh APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chibuikem_APK_Build_Package.zip'
      - '.github/workflows/chibuikem-fresh.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and locate Android project
        run: |
          mkdir -p project
          unzip -o Chibuikem_APK_Build_Package.zip -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -100

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chibuikem-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
